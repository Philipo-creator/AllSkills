<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Philip Chigozie">
  <meta name="description" content="Log in to your AllSkills account.">
  <title>AllSkills | Login</title>
  <link rel="icon" href="img/Skills.png">
  <link rel="stylesheet" href="styles/login.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="brand">
      <img src="img/Skills.png" alt="AllSkills logo">
      <span>AllSkills</span>
    </a>
    <a href="index.html" class="exit" class="BTT">Back to Home</a>
  </header>

  <main class="login-wrap">
    <section class="login-card">
      <h1>Welcome Back</h1>
      <p class="login-sub">Log in to continue your learning journey.</p>

      <form id="login-form" action="dashboard.html" method="get">
        <div>
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
        </div>
        <div>
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Your password" required>
        </div>

        <div class="login-options">
          <label class="remember">
            <input type="checkbox" name="remember"> Remember me
          </label>
        <a href="#">Forgot password?</a>
        </div>

        <button type="submit">Log In</button>
      </form>

      <p class="login-switch">
        New to AllSkills? <a href="apply.html">Apply now</a>
      </p>
    </section>
  </main>

  <footer class="app-footer">
    <p>Copyright &copy; AllSkills. All Rights Reserved.</p>
  </footer>

</body>
</html>
