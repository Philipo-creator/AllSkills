<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Philip Chigozie">
  <meta name="description" content="Reset your AllSkills password.">
  <title>AllSkills | Forgot Password</title>
  <link rel="icon" href="img/Skills.png">
  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="brand">
      <img src="img/Skills.png" alt="AllSkills logo">
      <span>AllSkills</span>
    </a>
    <a href="login.html" class="exit">Back to Login</a>
  </header>

  <main class="login-wrap">
    <section class="login-card">
      <h1>Forgot Password?</h1>
      <p class="login-sub">Enter your email address and we will send you a link to reset your password.</p>

      <form id="forgot-form" action="login.html" method="get">
        <div>
          <label for="forgot-email">Email Address</label>
          <input type="email" id="forgot-email" name="email" placeholder="you@example.com" required>
        </div>
        <button type="submit">Send Reset Link</button>
      </form>

      <p class="login-switch">
        Remembered it? <a href="login.html">Log in</a>
      </p>
    </section>
  </main>

  <footer class="app-footer">
    <p>Copyright &copy; AllSkills. All Rights Reserved.</p>
  </footer>

</body>
</html>
